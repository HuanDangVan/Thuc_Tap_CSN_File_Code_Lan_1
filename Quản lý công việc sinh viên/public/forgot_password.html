<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - SCHEDULE STUDENT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>SCHEDULE STUDENT</h1>
        <h2>Quên mật khẩu</h2>

        <p style="text-align:center; margin-bottom:20px; color:#64748b;">
            Nhập email đã đăng ký để yêu cầu đặt lại mật khẩu.
        </p>

        <div id="message" class="message"></div>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="Email">Email đăng ký</label>
                <input
                    type="email"
                    id="Email"
                    name="Email"
                    placeholder="Nhập email của bạn"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Gửi yêu cầu
            </button>
        </form>

        <p class="auth-link">
            <a href="login.html">← Quay lại đăng nhập</a>
        </p>
    </div>

    <script src="forgot-password.js"></script>
</body>
</html>
